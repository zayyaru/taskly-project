{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
  <section class="panel">
    <p class="eyebrow">Taskly</p>
    <h1>{{ heading }}</h1>
    <form method="post" class="stack">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="form-error">{{ form.non_field_errors }}</div>
      {% endif %}
      {% for field in form %}
        <label class="field">
          <span>{{ field.label }}</span>
          {{ field }}
          {% if field.errors %}
            <small>{{ field.errors|striptags }}</small>
          {% endif %}
        </label>
      {% endfor %}
      <div class="form-actions">
        <button class="button" type="submit">သိမ်းမည်</button>
        <a class="text-link" href="{% url 'task_list' %}">မလုပ်တော့ပါ</a>
      </div>
    </form>
  </section>
{% endblock %}
